<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TwentyQ</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        background: #0b0f19;
        color: #e8eefc;
      }
      .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
      .card {
        background: #121a2d;
        border: 1px solid #223052;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,.25);
      }
      h1 { margin: 0 0 6px; font-size: 24px; }
      p.sub { margin: 0 0 16px; opacity: .85; }

      .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

      .chat {
        height: 420px;
        overflow: auto;
        padding: 12px;
        background: #0f1524;
        border-radius: 12px;
        border: 1px solid #223052;
      }
      .msg { display: flex; margin: 10px 0; }
      .bubble {
        max-width: 78%;
        padding: 10px 12px;
        border-radius: 14px;
        line-height: 1.35;
        white-space: pre-wrap;
      }
      .bot { justify-content: flex-start; }
      .bot .bubble { background: #17213a; border: 1px solid #223052; }
      .you { justify-content: flex-end; }
      .you .bubble { background: #2a4fff; color: #fff; }

      .row { display: flex; gap: 10px; margin-top: 12px; }
      input {
        flex: 1;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px solid #223052;
        background: #0f1524;
        color: #e8eefc;
        outline: none;
      }
      button {
        padding: 12px 14px;
        border-radius: 12px;
        border: 0;
        background: #2a4fff;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid #223052;
        color: #e8eefc;
      }
      button:disabled { opacity: .5; cursor: not-allowed; }

      .hint { margin-top: 10px; font-size: 13px; opacity: .8; }

      .leaderboard h2 { margin: 0 0 10px; font-size: 18px; }
      .table {
        border: 1px solid #223052;
        border-radius: 12px;
        overflow: hidden;
        background: #0f1524;
      }
      .thead, .trow {
        display: grid;
        grid-template-columns: 44px 1fr 90px;
        gap: 10px;
        padding: 10px 12px;
        align-items: center;
      }
      .thead {
        background: #17213a;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .08em;
        opacity: .9;
      }
      .trow { border-top: 1px solid #223052; font-size: 14px; }
      .muted { opacity: .7; font-size: 12px; margin-top: 8px; }
      code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>TwentyQ</h1>
        <p class="sub">Type your answers: <code>yes</code>, <code>no</code>, <code>sometimes</code>, <code>not sure</code>.</p>

        <div class="grid">
          <div>
            <div id="chat" class="chat" aria-live="polite"></div>

            <div class="row">
              <input id="input" placeholder="Type your answer..." autocomplete="off" />
              <button id="send">Send</button>
              <button id="restart" class="secondary">Restart</button>
            </div>

            <div class="hint" id="status"></div>
          </div>

          <div class="leaderboard">
            <h2>Leaderboard</h2>
            <div class="table">
              <div class="thead">
                <div>#</div><div>Name / Guess</div><div>Qs</div>
              </div>
              <div id="lb"></div>
            </div>
            <div class="muted">Lowest questions wins. Updates when someone wins.</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const chatEl = document.getElementById("chat");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const restartBtn = document.getElementById("restart");
      const statusEl = document.getElementById("status");
      const lbEl = document.getElementById("lb");

      let sessionId = null;
      let busy = false;

      function addMsg(text, who) {
        const row = document.createElement("div");
        row.className = "msg " + (who === "you" ? "you" : "bot");

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        row.appendChild(bubble);
        chatEl.appendChild(row);
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function setBusy(v) {
        busy = v;
        sendBtn.disabled = v;
        restartBtn.disabled = v;
        inputEl.disabled = v;
        statusEl.textContent = v ? "Working..." : "";
      }

      async function apiPost(path, body) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const text = await res.text();
        try {
          return { ok: res.ok, status: res.status, json: JSON.parse(text) };
        } catch {
          return { ok: res.ok, status: res.status, json: { text: text || "Unknown error" } };
        }
      }

      async function apiGet(path) {
        const res = await fetch(path);
        const text = await res.text();
        try {
          return { ok: res.ok, status: res.status, json: JSON.parse(text) };
        } catch {
          return { ok: res.ok, status: res.status, json: null };
        }
      }

      async function loadLeaderboard() {
        const r = await apiGet("/api/leaderboard");
        lbEl.innerHTML = "";

        if (!r.ok || !r.json || !Array.isArray(r.json.top)) {
          const div = document.createElement("div");
          div.className = "trow";
          div.innerHTML = `<div>–</div><div>Couldn’t load leaderboard</div><div>–</div>`;
          lbEl.appendChild(div);
          return;
        }

        const rows = r.json.top;
        if (rows.length === 0) {
          const div = document.createElement("div");
          div.className = "trow";
          div.innerHTML = `<div>–</div><div>No scores yet</div><div>–</div>`;
          lbEl.appendChild(div);
          return;
        }

        rows.forEach((s, i) => {
          const div = document.createElement("div");
          div.className = "trow";
          const name = (s.name || "Anonymous").toString();
          const guess = (s.guess || "").toString();
          const q = Number(s.questions || 0);
          div.innerHTML = `<div>${i + 1}</div><div><strong>${name}</strong><br><span style="opacity:.8">${guess}</span></div><div><strong>${q}</strong></div>`;
          lbEl.appendChild(div);
        });
      }

      async function startGame() {
        setBusy(true);
        chatEl.innerHTML = "";
        addMsg("Starting...", "bot");

        const r = await apiPost("/api/start", {});
        if (!r.ok) {
          addMsg("Backend error starting game.", "bot");
          setBusy(false);
          return;
        }

        sessionId = r.json.sessionId;
        chatEl.innerHTML = "";
        addMsg(r.json.text || "Think of something. I’ll try to guess it in 20 questions.", "bot");
        setBusy(false);
      }

      async function sendAnswer() {
        const answer = inputEl.value.trim();
        if (!answer || busy) return;

        inputEl.value = "";
        addMsg(answer, "you");

        setBusy(true);
        const r = await apiPost("/api/message", { sessionId, userAnswer: answer });

        if (!r.ok) {
          addMsg("Backend error: " + (r.json?.details || r.json?.text || "Request failed"), "bot");
          setBusy(false);
          return;
        }

        // Win case
        if (r.json && r.json.won) {
          addMsg(r.json.text || "🎉 Score saved!", "bot");
          await loadLeaderboard();
          setBusy(false);
          return;
        }

        addMsg(r.json.text || "OK", "bot");
        setBusy(false);
      }

      sendBtn.addEventListener("click", sendAnswer);
      restartBtn.addEventListener("click", startGame);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendAnswer();
      });

      (async function init() {
        await loadLeaderboard();
        await startGame();
      })();
    </script>
  </body>
</html>

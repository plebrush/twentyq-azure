<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TwentyQ</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #0b0f19; color: #e8eefc; }
      .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
      .card { background: #121a2a; border: 1px solid #223052; border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p.sub { margin: 0 0 16px; opacity: .8; }

      .chat { height: 420px; overflow: auto; padding: 12px; background: #0f1524; border-radius: 12px; border: 1px solid #223052; }
      .msg { display: flex; margin: 10px 0; }
      .bubble { max-width: 75%; padding: 10px 12px; border-radius: 14px; line-height: 1.35; white-space: pre-wrap; }
      .bot { justify-content: flex-start; }
      .bot .bubble { background: #17213a; border: 1px solid #223052; }
      .you { justify-content: flex-end; }
      .you .bubble { background: #2a4fff; color: white; }

      .row { display: flex; gap: 10px; margin-top: 12px; }
      input { flex: 1; padding: 12px 12px; border-radius: 12px; border: 1px solid #223052; background: #0f1524; color: #e8eefc; }
      button { padding: 12px 14px; border-radius: 12px; border: 0; background: #2a4fff; color: white; font-weight: 600; cursor: pointer; }
      button.secondary { background: transparent; border: 1px solid #223052; color: #e8eefc; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .hint { margin-top: 10px; font-size: 13px; opacity: .8; }
      code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <h1>TwentyQ</h1>
        <p class="sub">Type your answers: <code>yes</code>, <code>no</code>, <code>sometimes</code>, <code>not sure</code>.</p>

        <div id="chat" class="chat" aria-live="polite"></div>

        <div class="row">
          <input id="input" placeholder="Type your answer…" autocomplete="off" />
          <button id="send">Send</button>
          <button id="restart" class="secondary">Restart</button>
        </div>

        <div class="hint" id="status"></div>
      </div>
    </div>

    <script>
      const chatEl = document.getElementById("chat");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const restartBtn = document.getElementById("restart");
      const statusEl = document.getElementById("status");

      let sessionId = null;

      function addMsg(role, text) {
        const row = document.createElement("div");
        row.className = "msg " + (role === "you" ? "you" : "bot");
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        row.appendChild(bubble);
        chatEl.appendChild(row);
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function setStatus(text) {
        statusEl.textContent = text || "";
      }

      async function api(path, body) {
        const res = await fetch(`/api/${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {})
        });
        if (!res.ok) {
          const t = await res.text();
          throw new Error(t || `Request failed: ${res.status}`);
        }
        return res.json();
      }

      async function startGame() {
        setStatus("Starting game…");
        chatEl.innerHTML = "";
        sessionId = null;

        // For now this will fail until we build the backend,
        // but the UI is ready.
        try {
          const data = await api("start", {});
          sessionId = data.sessionId;
          addMsg("bot", data.text || "Think of something. I’ll ask yes/no questions.");
          setStatus("");
        } catch (e) {
          addMsg("bot", "Backend not connected yet. Next step is creating /api/start in Azure Functions.");
          setStatus("Waiting for backend…");
        }
      }

      async function sendAnswer() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";
        addMsg("you", text);

        if (!sessionId) {
          addMsg("bot", "No session yet — hit Restart to start a game.");
          return;
        }

        sendBtn.disabled = true;
        try {
          const data = await api("message", { sessionId, userAnswer: text });
          addMsg("bot", data.text || "(no response)");
        } catch (e) {
          addMsg("bot", "Backend error: " + e.message);
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener("click", sendAnswer);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendAnswer();
      });
      restartBtn.addEventListener("click", startGame);

      // Auto-start when page loads
      startGame();
    </script>
  </body>
</html>
